<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="app.title">Mindsnap</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body oncontextmenu="return false;">
  <!-- Custom Titlebar -->
  <header id="custom-titlebar" class="custom-titlebar" data-tauri-drag-region>
    <div class="titlebar-left" data-tauri-drag-region>
      <div class="titlebar-logo">
        <img src="./icon.png" width="16" height="16" alt="Mindsnap" style="display: block;" />
      </div>
      <span class="titlebar-title">Mindsnap</span>
      <span id="titlebar-version" class="titlebar-badge">v1.1-beta</span>
    </div>

    <div class="titlebar-center" data-tauri-drag-region>
      <span class="titlebar-hint" data-i18n="titlebar.hint"></span>
    </div>

    <div class="titlebar-controls">
      <button type="button" id="btn-win-minimize" class="win-btn win-minimize" data-i18n-title="titlebar.minimize">
        <svg width="11" height="11" viewBox="0 0 12 12">
          <line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></line>
        </svg>
      </button>
      <button type="button" id="btn-win-maximize" class="win-btn win-maximize" data-i18n-title="titlebar.maximize">
        <svg id="icon-win-maximize" width="10" height="10" viewBox="0 0 12 12">
          <rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3" rx="1.5"></rect>
        </svg>
        <svg id="icon-win-restore" width="10" height="10" viewBox="0 0 12 12" style="display: none;">
          <rect x="3.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2" rx="1.2"></rect>
          <rect x="1.5" y="3.5" width="7" height="7" fill="var(--bg-card)" stroke="currentColor" stroke-width="1.2" rx="1.2"></rect>
        </svg>
      </button>
      <button type="button" id="btn-win-close" class="win-btn win-close" data-i18n-title="titlebar.close">
        <svg width="10" height="10" viewBox="0 0 12 12">
          <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></line>
          <line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></line>
        </svg>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-mark">
          <img src="./icon.png" width="34" height="34" alt="Mindsnap" style="display: block;" />
        </div>
        <div class="brand-text">
          <span class="brand-name">Mindsnap</span>
          <span class="brand-tagline" data-i18n="brand.tagline"></span>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-tab="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
          <span data-i18n="nav.dashboard"></span>
        </button>

        <button class="nav-item" data-tab="apps">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
          <span data-i18n="nav.apps"></span>
          <span id="nav-apps-count" class="nav-badge">0</span>
        </button>

        <button class="nav-item" data-tab="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span data-i18n="nav.settings"></span>
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div>
          <h1 id="page-title" class="page-title" data-i18n="tabs.dashboard.title"></h1>
          <p id="page-subtitle" class="page-subtitle" data-i18n="tabs.dashboard.subtitle"></p>
        </div>
      </header>

      <!-- Dashboard Tab -->
      <section id="tab-dashboard" class="tab-pane active">
        <div class="dashboard-hero">
          <div class="circular-timer-container">
            <svg class="circular-timer-svg" width="270" height="270" viewBox="0 0 270 270">
              <defs>
                <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#6366f1" />
                  <stop offset="50%" stop-color="#8b5cf6" />
                  <stop offset="100%" stop-color="#ef4444" />
                </linearGradient>
              </defs>
              <circle class="timer-track" cx="135" cy="135" r="115" stroke-width="11" />
              <circle id="timer-progress" class="timer-progress" cx="135" cy="135" r="115" stroke-width="11" />
            </svg>
            <div class="timer-center-info">
              <div id="active-app-pill" class="app-pill" data-i18n="dashboard.desktop"></div>
              <div id="dashboard-timer" class="timer-digits">00:00</div>
              <div id="dashboard-status-label" class="timer-sublabel" data-i18n="dashboard.focus_mode"></div>
            </div>
          </div>

          <div class="hero-stats">
            <div class="stat-card">
              <div class="stat-icon focus">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
              </div>
              <div class="stat-meta">
                <span class="stat-label" data-i18n="dashboard.stat_active_app"></span>
                <span id="stat-active-app" class="stat-value" data-i18n="dashboard.desktop"></span>
                <span id="stat-active-title" class="stat-sub"></span>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon target">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 14 14"></polyline>
                </svg>
              </div>
              <div class="stat-meta">
                <span class="stat-label" data-i18n="dashboard.stat_threshold"></span>
                <span id="stat-threshold-val" class="stat-value"></span>
                <span id="stat-repeat-val" class="stat-sub"></span>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon alert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
              </div>
              <div class="stat-meta">
                <span class="stat-label" data-i18n="dashboard.stat_alerts_session"></span>
                <span id="stat-alert-count" class="stat-value">0</span>
                <span id="stat-alert-status" class="stat-sub"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Apps Tab -->
      <section id="tab-apps" class="tab-pane">
        <div class="apps-header-action">
          <div class="apps-search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="blacklist-search" data-i18n-placeholder="apps.search_placeholder" />
          </div>
          <button id="btn-browse-exe" class="btn btn-primary" data-i18n-title="apps.btn_browse_tooltip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
            <span data-i18n="apps.btn_browse"></span>
          </button>
        </div>

        <div class="apps-dual-layout">
          <div class="apps-column">
            <div class="column-header">
              <div class="column-title">
                <span class="pulse-mini-dot"></span>
                <span data-i18n="apps.running_windows"></span>
              </div>
              <button id="btn-refresh-running" class="btn-icon" data-i18n-title="apps.refresh_tooltip">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
              </button>
            </div>
            <div id="running-apps-list" class="apps-card-list"></div>
          </div>

          <div class="apps-column">
            <div class="column-header">
              <div class="column-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
                <span data-i18n="apps.tracked_list"></span>
                <span id="tracked-count-badge" class="pill-badge-small">0</span>
              </div>
            </div>
            <div id="tracked-apps-list" class="apps-card-list"></div>
          </div>
        </div>
      </section>

      <!-- Settings Tab -->
      <section id="tab-settings" class="tab-pane">
        <div class="settings-wrapper">
          <div class="settings-group">
            <div class="group-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span data-i18n="settings.group_timing"></span>
            </div>

            <div class="setting-card">
              <div class="setting-text">
                <label for="slider-initial" data-i18n="settings.initial_alert_label"></label>
                <p data-i18n="settings.initial_alert_desc"></p>
              </div>
              <div class="slider-control">
                <input type="range" id="slider-initial" class="custom-range-slider" min="1" max="60" value="5" />
                <span id="badge-initial-min" class="pill-badge"></span>
              </div>
              <div class="slider-presets" data-target="slider-initial">
                <button type="button" class="preset-chip" data-val="3"></button>
                <button type="button" class="preset-chip" data-val="5"></button>
                <button type="button" class="preset-chip" data-val="10"></button>
                <button type="button" class="preset-chip" data-val="15"></button>
                <button type="button" class="preset-chip" data-val="25"></button>
              </div>
            </div>

            <div class="setting-card">
              <div class="setting-text">
                <label for="slider-repeat" data-i18n="settings.repeat_alert_label"></label>
                <p data-i18n="settings.repeat_alert_desc"></p>
              </div>
              <div class="slider-control">
                <input type="range" id="slider-repeat" class="custom-range-slider" min="1" max="30" value="2" />
                <span id="badge-repeat-min" class="pill-badge"></span>
              </div>
              <div class="slider-presets" data-target="slider-repeat">
                <button type="button" class="preset-chip" data-val="1"></button>
                <button type="button" class="preset-chip" data-val="2"></button>
                <button type="button" class="preset-chip" data-val="5"></button>
                <button type="button" class="preset-chip" data-val="10"></button>
              </div>
            </div>
          </div>

          <div class="settings-group">
            <div class="group-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span data-i18n="settings.group_system"></span>
            </div>

            <div class="setting-card toggle-card">
              <div class="setting-text">
                <label for="toggle-sound" data-i18n="settings.sound_label"></label>
                <p data-i18n="settings.sound_desc"></p>
              </div>
              <label class="switch">
                <input type="checkbox" id="toggle-sound" checked />
                <span class="slider"></span>
              </label>
            </div>

            <div class="setting-card toggle-card">
              <div class="setting-text">
                <label for="toggle-minimize" data-i18n="settings.minimize_label"></label>
                <p data-i18n="settings.minimize_desc"></p>
              </div>
              <label class="switch">
                <input type="checkbox" id="toggle-minimize" checked />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="settings-group">
            <div class="group-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
              <span data-i18n="settings.group_language"></span>
            </div>

            <div class="setting-card select-card">
              <div class="setting-text">
                <label for="select-language" data-i18n="settings.language_label"></label>
                <p data-i18n="settings.language_desc"></p>
              </div>
              <div class="select-control">
                <select id="select-language" class="custom-select">
                  <option value="auto" data-i18n="settings.lang_auto"></option>
                </select>
              </div>
            </div>
          </div>

          <div class="settings-group">
            <div class="group-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span data-i18n="settings.group_about"></span>
            </div>

            <div class="setting-card about-card">
              <div class="about-brand-row">
                <img src="./icon.png" alt="Mindsnap" class="about-logo" />
                <div class="about-brand-info">
                  <div class="about-name-badge">
                    <span class="about-title">Mindsnap</span>
                    <span class="pill-badge-small" id="about-app-version">v1.1-beta</span>
                  </div>
                  <p class="about-desc" data-i18n="settings.about_desc"></p>
                </div>
              </div>

              <div class="about-meta-grid">
                <div class="about-meta-item">
                  <span class="about-meta-label" data-i18n="settings.about_developer_label"></span>
                  <span class="about-meta-value">x0thra</span>
                </div>
                <div class="about-meta-item">
                  <span class="about-meta-label" data-i18n="settings.about_license_label"></span>
                  <span class="about-meta-value badge-license">MIT</span>
                </div>
                <div class="about-meta-item">
                  <span class="about-meta-label" data-i18n="settings.about_website_label"></span>
                  <button type="button" id="btn-open-github" class="about-link-btn" title="GitHub Repository">
                    <span>GitHub</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                      <polyline points="15 3 21 3 21 9"></polyline>
                      <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="about-testers-section">
                <div class="testers-header">
                  <div class="testers-title-wrap">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span data-i18n="settings.about_testers_label"></span>
                  </div>
                  <p class="testers-sub" data-i18n="settings.about_testers_desc"></p>
                </div>
                <div id="testers-list" class="testers-chip-cloud"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
