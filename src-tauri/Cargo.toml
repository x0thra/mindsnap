[package]
name = "mindsnap"
version = "1.1.0-beta"
description = "Mindsnap - Digital Awareness & Usage Breaker"
authors = ["x0thra"]
homepage = "https://github.com/x0thra/mindsnap"
repository = "https://github.com/x0thra/mindsnap"
license = "MIT"
edition = "2021"

[lib]
name = "mindsnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
dirs = "5"
thiserror = "2"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-icons = "0.4.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Media_Audio",
] }

